<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Cancelar turno</title>
<style>
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    max-width: 420px;
    margin: 3rem auto;
    padding: 0 1rem;
    color: #222;
  }
  h1 { font-size: 1.4rem; }
  .card {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 1.25rem;
    margin-top: 1rem;
  }
  .card p { margin: 0.35rem 0; }
  button {
    padding: 0.6rem 1.2rem;
    border: none;
    border-radius: 4px;
    background: #c81e1e;
    color: #fff;
    cursor: pointer;
    font-size: 1rem;
    margin-top: 1rem;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  #status { margin-top: 1rem; font-weight: 600; }
  #status.success { color: #1a7f37; }
  #status.error { color: #c81e1e; }
</style>
</head>
<body>
  <h1>Cancelar turno</h1>
  <div id="content">Cargando...</div>

<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  const token = params.get("token");
  const content = document.getElementById("content");

  if (!token) {
    content.textContent = "Falta el enlace completo. Revisá el link del email.";
    return;
  }

  async function load() {
    try {
      const res = await fetch(`/api/cancel?token=${encodeURIComponent(token)}`);
      const data = await res.json();

      if (!res.ok) {
        content.textContent = data.error || "No se pudo encontrar la reserva.";
        return;
      }

      if (data.status === "cancelled") {
        content.innerHTML = `<div class="card"><p>Este turno ya estaba cancelado.</p></div>`;
        return;
      }

      content.innerHTML = `
        <div class="card">
          <p><strong>Servicio:</strong> ${data.service}</p>
          <p><strong>Fecha:</strong> ${data.date}</p>
          <p><strong>Hora:</strong> ${data.time}</p>
          <button id="cancel-btn">Cancelar turno</button>
          <p id="status"></p>
        </div>
      `;

      document.getElementById("cancel-btn").addEventListener("click", cancelBooking);
    } catch (err) {
      content.textContent = "Error de conexión, intentá de nuevo.";
    }
  }

  async function cancelBooking() {
    const btn = document.getElementById("cancel-btn");
    const statusBox = document.getElementById("status");
    btn.disabled = true;
    statusBox.textContent = "Cancelando...";
    statusBox.className = "";

    try {
      const res = await fetch("/api/cancel", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token }),
      });
      const data = await res.json();

      if (!res.ok) {
        statusBox.textContent = data.error || "No se pudo cancelar el turno.";
        statusBox.className = "error";
        btn.disabled = false;
        return;
      }

      statusBox.textContent = "Turno cancelado correctamente.";
      statusBox.className = "success";
    } catch (err) {
      statusBox.textContent = "Error de conexión, intentá de nuevo.";
      statusBox.className = "error";
      btn.disabled = false;
    }
  }

  load();
})();
</script>
</body>
</html>
