<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Agenda de Pekes</title>
<style>
  :root {
    --bg: #000;
    --panel: #0b0b0b;
    --border: #2a2a2a;
    --text: #f2f2f2;
    --muted: #b5b5b5;
    --accent: #c9a2f0;
    --free-bg: #fdfdfd;
    --booked-bg: #f1e3fa;
    --booked-tag: #2a1a3d;
    --ok: #3fb950;
    --error: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 1.5rem 1rem;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .panel {
    max-width: 780px;
    margin: 0 auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.25rem 1.5rem;
  }
  .hidden { display: none !important; }

  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
  h1 { font-size: 1.25rem; margin: 0 0 0.25rem; }
  #day-label { margin: 0; color: var(--muted); font-size: 0.95rem; }
  .pill {
    font-size: 0.8rem;
    padding: 0.15rem 0.5rem;
    border-radius: 6px;
    white-space: nowrap;
  }
  #count { color: var(--ok); background: #0f2a16; }

  .toolbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 1rem 0; border-bottom: 1px solid var(--border); margin-bottom: 1rem;
  }
  .date-pick { display: flex; align-items: center; gap: 0.5rem; font-weight: 600; }
  .date-pick input {
    background: transparent; color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 0.3rem 0.5rem; font: inherit; color-scheme: dark;
  }
  .nav button {
    background: none; border: none; color: var(--text); cursor: pointer;
    font: inherit; padding: 0.25rem 0.35rem;
  }

  .slot { display: flex; align-items: center; gap: 1rem; margin-bottom: 0.75rem; }
  .slot .time { width: 3.2rem; font-weight: 700; flex-shrink: 0; }
  .slot .card {
    flex: 1; min-width: 0; color: #111; border-radius: 8px; padding: 0.6rem 0.75rem;
  }
  .slot.free .card { background: var(--free-bg); font-weight: 600; }
  .slot.booked .card { background: var(--booked-bg); }
  .card .who { font-weight: 600; margin: 0 0 0.25rem; }
  .card .detail { margin: 0.15rem 0; font-size: 0.9rem; color: #333; overflow-wrap: anywhere; }
  .card a { color: #5b2a86; }
  .tag-free { color: var(--text); background: #222; }
  .tag-booked { color: var(--accent); background: var(--booked-tag); }

  .empty { color: var(--muted); padding: 1rem 0; }

  #login form { display: flex; flex-direction: column; gap: 0.75rem; max-width: 320px; }
  #login input {
    padding: 0.6rem; border-radius: 6px; border: 1px solid var(--border);
    background: #151515; color: var(--text); font: inherit;
  }
  .btn {
    padding: 0.6rem 1rem; border: none; border-radius: 6px; cursor: pointer;
    background: var(--accent); color: #1a0f26; font: inherit; font-weight: 600;
  }
  .error { color: var(--error); }
  .logout {
    background: none; border: none; color: var(--muted); cursor: pointer;
    font: inherit; font-size: 0.85rem; text-decoration: underline; padding: 0; margin-top: 0.5rem;
  }

  @media (max-width: 480px) {
    .panel { padding: 1rem; }
    .slot { gap: 0.5rem; flex-wrap: wrap; }
    .slot .card { flex-basis: calc(100% - 3.7rem); }
    .slot .pill { margin-left: 3.7rem; }
  }
</style>
</head>
<body>
  <div class="panel">
    <section id="login" class="hidden">
      <h1>Agenda de Pekes</h1>
      <p id="day-label-login" style="color: var(--muted)">Ingresá la clave para ver los turnos.</p>
      <form id="login-form">
        <input id="key" type="password" placeholder="Clave" autocomplete="current-password" required />
        <button class="btn" type="submit">Entrar</button>
        <p id="login-error" class="error"></p>
      </form>
    </section>

    <section id="agenda" class="hidden">
      <header>
        <div>
          <h1>Agenda de Pekes</h1>
          <p id="day-label"></p>
        </div>
        <span id="count" class="pill"></span>
      </header>

      <div class="toolbar">
        <label class="date-pick">
          📅 <input id="date" type="date" />
        </label>
        <div class="nav">
          <button id="prev" aria-label="Día anterior">‹</button>
          <button id="today">Hoy</button>
          <button id="next" aria-label="Día siguiente">›</button>
        </div>
      </div>

      <div id="slots">Cargando...</div>
      <button id="logout" class="logout">Cerrar sesión</button>
    </section>
  </div>

<script>
(function () {
  const STORAGE_KEY = "pekes-admin-key";
  const loginSection = document.getElementById("login");
  const agendaSection = document.getElementById("agenda");
  const dateInput = document.getElementById("date");
  const slotsBox = document.getElementById("slots");

  function getKey() {
    try { return localStorage.getItem(STORAGE_KEY); } catch { return null; }
  }
  function setKey(value) {
    try {
      if (value) localStorage.setItem(STORAGE_KEY, value);
      else localStorage.removeItem(STORAGE_KEY);
    } catch {}
  }
  let adminKey = getKey();

  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    })[c]);
  }

  // Fecha de hoy en Argentina (UTC-3), en formato YYYY-MM-DD.
  function todayArg() {
    return new Date(Date.now() - 3 * 60 * 60 * 1000).toISOString().slice(0, 10);
  }
  function shiftDate(date, days) {
    const d = new Date(date + "T00:00:00Z");
    d.setUTCDate(d.getUTCDate() + days);
    return d.toISOString().slice(0, 10);
  }
  function formatLongDate(date) {
    const text = new Date(date + "T12:00:00Z").toLocaleDateString("es-AR", {
      weekday: "long", day: "numeric", month: "long", timeZone: "UTC",
    });
    return text.charAt(0).toUpperCase() + text.slice(1);
  }

  function showLogin(message) {
    agendaSection.classList.add("hidden");
    loginSection.classList.remove("hidden");
    document.getElementById("login-error").textContent = message || "";
    document.getElementById("key").focus();
  }

  function renderSlot(slot) {
    if (!slot.booked) {
      return `
        <div class="slot free">
          <span class="time">${slot.time}</span>
          <div class="card">Turno disponible</div>
          <span class="pill tag-free">Libre</span>
        </div>`;
    }

    const who = slot.ownerName
      ? `${escapeHtml(slot.ownerName)} · ${escapeHtml(slot.name)}`
      : escapeHtml(slot.name);
    const details = [];
    if (slot.phone) {
      details.push(`📞 <a href="tel:${escapeHtml(slot.phone)}">${escapeHtml(slot.phone)}</a>`);
    }
    if (slot.race) details.push(`🐶 ${escapeHtml(slot.race)}`);
    if (slot.service) details.push(`✂️ ${escapeHtml(slot.service)}`);
    details.push(slot.pickupMethod === "retiro_domicilio" ? "🚗 Retiro a domicilio" : "🚶 La lleva personalmente");
    if (slot.notes) details.push(`📝 ${escapeHtml(slot.notes)}`);

    return `
      <div class="slot booked">
        <span class="time">${slot.time}</span>
        <div class="card">
          <p class="who">${who}</p>
          ${details.map((d) => `<p class="detail">${d}</p>`).join("")}
        </div>
        <span class="pill tag-booked">Reservado</span>
      </div>`;
  }

  async function load(date) {
    dateInput.value = date;
    document.getElementById("day-label").textContent = formatLongDate(date);
    slotsBox.textContent = "Cargando...";

    try {
      const res = await fetch(`/api/agenda?date=${date}`, {
        headers: { "x-admin-key": adminKey },
      });
      if (res.status === 401) {
        adminKey = null;
        setKey(null);
        showLogin("Clave incorrecta.");
        return false;
      }
      const data = await res.json();
      if (!res.ok) {
        slotsBox.textContent = data.error || "No se pudo cargar la agenda.";
        return true;
      }

      const booked = data.slots.filter((s) => s.booked).length;
      document.getElementById("count").textContent = `${booked} ${booked === 1 ? "turno" : "turnos"}`;

      slotsBox.innerHTML = data.slots.length
        ? data.slots.map(renderSlot).join("")
        : `<p class="empty">${data.open ? "Sin horarios para este día." : "Cerrado este día."}</p>`;
      return true;
    } catch {
      slotsBox.textContent = "Error de conexión, intentá de nuevo.";
      return true;
    }
  }

  async function enter() {
    loginSection.classList.add("hidden");
    agendaSection.classList.remove("hidden");
    return load(dateInput.value || todayArg());
  }

  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    adminKey = document.getElementById("key").value;
    if (await enter()) setKey(adminKey);
  });
  dateInput.addEventListener("change", () => dateInput.value && load(dateInput.value));
  document.getElementById("prev").addEventListener("click", () => load(shiftDate(dateInput.value, -1)));
  document.getElementById("next").addEventListener("click", () => load(shiftDate(dateInput.value, 1)));
  document.getElementById("today").addEventListener("click", () => load(todayArg()));
  document.getElementById("logout").addEventListener("click", () => {
    adminKey = null;
    setKey(null);
    document.getElementById("key").value = "";
    showLogin();
  });

  if (adminKey) enter();
  else showLogin();
})();
</script>
</body>
</html>
