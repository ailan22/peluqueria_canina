<!-- Botón "Reservar turno": abre un modal con el formulario de reserva propio -->
<button
  id="reservar-turno-btn"
  type="button"
  class="boton-reservar-flotante"
  aria-haspopup="dialog"
  aria-controls="booking-modal"
>
  Reservar turno
</button>

<div id="booking-modal" class="booking-modal" hidden>
  <div class="booking-modal__overlay" data-booking-close></div>
  <div class="booking-modal__content" role="dialog" aria-modal="true" aria-labelledby="booking-modal-title">
    <button type="button" class="booking-modal__close" data-booking-close aria-label="Cerrar">&times;</button>
    <div class="booking-modal__bg">
      <h2 id="booking-modal-title">Reservar turno</h2>
      {{ partial "booking-form.html" . }}
    </div>
  </div>
</div>

<div id="booking-success-modal" class="booking-success-modal" hidden>
  <div class="booking-success-modal__overlay" data-success-close></div>
  <div class="booking-success-modal__content" role="dialog" aria-modal="true" aria-labelledby="booking-success-title">
    <div class="booking-success-modal__icon" aria-hidden="true">
      <svg viewBox="0 0 52 52" width="64" height="64">
        <circle class="booking-success-modal__icon-circle" cx="26" cy="26" r="25" />
        <path class="booking-success-modal__icon-check" d="M14 27l7 7 16-16" />
      </svg>
    </div>
    <h2 id="booking-success-title">¡Turno reservado!</h2>
    <p id="booking-success-message"></p>
    <button type="button" class="booking-success-modal__close-btn" data-success-close>Entendido</button>
  </div>
</div>

<script>
  (function () {
    var btn = document.getElementById("reservar-turno-btn");
    var modal = document.getElementById("booking-modal");
    var successModal = document.getElementById("booking-success-modal");
    var successMessage = document.getElementById("booking-success-message");
    if (!btn || !modal) return;

    function openModal() {
      modal.hidden = false;
      document.body.style.overflow = "hidden";
    }

    function closeModal() {
      modal.hidden = true;
      document.body.style.overflow = "";
    }

    btn.addEventListener("click", openModal);

    var menuCardReserva = document.getElementById("menu-card-reserva");
    if (menuCardReserva) {
      menuCardReserva.addEventListener("click", function (e) {
        e.preventDefault();
        openModal();
      });
    }

    modal.querySelectorAll("[data-booking-close]").forEach(function (el) {
      el.addEventListener("click", closeModal);
    });

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && !modal.hidden) closeModal();
      if (e.key === "Escape" && successModal && !successModal.hidden) closeSuccessModal();
    });

    function closeSuccessModal() {
      successModal.hidden = true;
      document.body.style.overflow = "";
    }

    if (successModal) {
      successModal.querySelectorAll("[data-success-close]").forEach(function (el) {
        el.addEventListener("click", closeSuccessModal);
      });

      // Expuesto para que booking.js dispare el aviso llamativo al confirmar la reserva.
      window.showBookingSuccess = function (message) {
        closeModal();
        if (successMessage) successMessage.textContent = message;
        successModal.hidden = false;
        document.body.style.overflow = "hidden";
      };
    }
  })();
</script>
