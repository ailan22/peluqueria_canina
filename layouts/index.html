<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Site.Title }}</title>
  <meta name="description" content="{{ .Site.Params.description }}">
  {{ with resources.Get "images/favicon.png" }}
  <link rel="icon" type="image/png" href="{{ .RelPermalink }}">
  {{ end }}

  {{ $imgDesktop := resources.Get "images/portada.png" }}
  {{ $imgDesktop := $imgDesktop.Resize "1920x q85 webp" }}
  {{ $imgMobile := resources.Get "images/portada_cel.png" }}
  {{ $imgMobile := $imgMobile.Resize "1080x q85 webp" }}
  <meta property="og:title" content="{{ .Site.Title }}">
  <meta property="og:description" content="{{ .Site.Params.description }}">
  <meta property="og:image" content="{{ $imgDesktop.Permalink }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ .Site.Title }}">
  <meta name="twitter:description" content="{{ .Site.Params.description }}">
  <meta name="twitter:image" content="{{ $imgDesktop.Permalink }}">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow-x: hidden;
    }

    .construction-page {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      background-image: url('{{ $imgDesktop.RelPermalink }}');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: scroll;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: 'Oswald', Arial, sans-serif;
    }

    @media (max-width: 768px) {
      .construction-page {
        background-image: url('{{ $imgMobile.RelPermalink }}');
      }
    }

    .construction-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
    }

    .construction-message {
      position: relative;
      color: #fff;
      padding: 1.5rem 2rem;
      max-width: 90%;
    }

    .construction-message h1 {
      font-size: clamp(1.8rem, 5vw, 3.5rem);
      margin: 0 0 0.5rem 0;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
      letter-spacing: 0.05em;
    }

    .construction-message p {
      font-size: clamp(1rem, 2.5vw, 1.4rem);
      margin: 0;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body>
  <div class="construction-page">
    
  </div>
</body>
</html>
